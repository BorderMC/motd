name: Update main.conf

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  update-main-conf:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate main.conf
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          def read_setting(text, key):
              match = re.search(rf'(?m)^{re.escape(key)}:\s*"(.*)"\s*$', text)
              if not match:
                  raise SystemExit(f'Missing "{key}" in settings.yml')
              return match.group(1)

          def conf_quote(value):
              return value.replace('\\', '\\\\').replace('"', '\\"')

          settings = Path('settings.yml').read_text(encoding='utf-8')
          title = read_setting(settings, 'title')
          description_template = read_setting(settings, 'description')

          messages = [
              line.strip()
              for line in Path('edit-me.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]

          motds = ['motds=[']
          for index, message in enumerate(messages):
              description = description_template.replace('{motd}', message)
              motds.extend([
                  '    {',
                  f'        line1="{conf_quote(title)}"',
                  f'        line2="{conf_quote(description)}"',
                  '        icon=random',
                  f'    }}{"," if index < len(messages) - 1 else ""}',
              ])
          motds.append(']')
          motds_block = '\n'.join(motds)

          config_path = Path('main.conf')
          config = config_path.read_text(encoding='utf-8')
          updated = re.sub(
              r'(?s)motds=\[\s*.*?\n\]',
              motds_block,
              config,
              count=1,
          )
          if updated == config:
              print('main.conf is already up to date')
          else:
              config_path.write_text(updated, encoding='utf-8')
              print('Updated main.conf')
          PY

      - name: Commit generated main.conf
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update main.conf from edit-me.txt
          file_pattern: main.conf
